apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      enableServiceLinks: false
      # Works whether the ghcr.io packages are public or private. If private, create
      # the "ghcr-pull" secret (see the walkthrough); if public, a missing secret is harmless.
      imagePullSecrets:
        - name: ghcr-pull
      # Wait for the database and photo storage so the API doesn't crash-loop at startup.
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z db 5432 && nc -z photos 8333; do echo waiting; sleep 2; done
      containers:
        - name: api
          image: ghcr.io/nate-wil/bikelog/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bikelog-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bikelog-secrets
                  key: JWT_SECRET
            - name: S3_ENDPOINT_URL
              value: http://photos:8333
            - name: S3_BUCKET
              value: bikelog-photos
            # Photo links are relative, so they load through whatever address the site is opened at.
            - name: S3_PUBLIC_BASE_URL
              value: /photos/bikelog-photos
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  ports:
    - port: 8000
  selector:
    app: api
  type: ClusterIP
