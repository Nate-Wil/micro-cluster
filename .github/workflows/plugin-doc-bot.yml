name: Build Plugin Documentation Bot

on:
  push:
    branches:
      - main
    paths:
      - "services/plugin-doc-bot/**"
      - ".github/workflows/plugin-doc-bot.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./services/plugin-doc-bot
          push: true
          tags: |
            ghcr.io/nate-wil/plugin-doc-bot:latest
            ghcr.io/nate-wil/plugin-doc-bot:${{ github.sha }}
